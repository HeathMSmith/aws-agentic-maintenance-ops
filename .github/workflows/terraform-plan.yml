
name: Terraform Plan

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: agentic-maintenance-ops-terraform-dev
    cancel-in-progress: false

jobs:
    terraform-plan:
        name: Terraform Plan
        runs-on: ubuntu-latest
        environment: dev

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}
                  allowed-account-ids: "291634988692"

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: "1.15.3"

            - name: Build Lambda package
              run: bash scripts/build_lambda.sh

            - name: Initialize Terraform
              run: terraform -chdir=terraform init -lockfile=readonly -input=false

            - name: Validate Terraform
              run: terraform -chdir=terraform validate -no-color

            - name: Generate Terraform plan
              run: |
                  terraform -chdir=terraform plan \
                    -input=false \
                    -no-color \
                    -lock-timeout=5m \
                    -var="lambda_zip_path=${GITHUB_WORKSPACE}/build/lambda/aws-agentic-maintenance-lambda.zip" \
                    -out=tfplan
